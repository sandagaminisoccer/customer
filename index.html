<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>ADMIN SANDAGA MINISOCCER</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #fff; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .lock {
    width: clamp(56px, 12vw, 84px); height: clamp(56px, 12vw, 84px);
    margin-bottom: clamp(16px, 3vh, 28px); color: #f5c451;
  }
  .status {
    margin: 0 0 14px; padding: 6px 16px; border: 1px solid #f5c451; border-radius: 999px;
    color: #f5c451; font-size: clamp(.75rem, 2.8vw, .95rem); font-weight: 700; letter-spacing: .18em;
  }
  h1 {
    margin: 0 0 clamp(28px, 5vh, 52px); max-width: 900px;
    font-size: clamp(1rem, 4.2vw, 1.8rem); font-weight: 600;
    letter-spacing: .12em; line-height: 1.6; text-wrap: balance;
  }
  h1 .date {
    display: block; margin-top: .6em; white-space: nowrap;
    font-size: clamp(1.5rem, 7.5vw, 4rem); font-weight: 800;
    letter-spacing: .06em; line-height: 1.15; color: #f5c451;
  }
  .timer {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2.5vw, 24px); width: 100%; max-width: 620px;
  }
  .box { border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: clamp(14px, 3.5vw, 28px) 4px; }
  .num { font-size: clamp(2rem, 10vw, 4.5rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .lbl { font-size: clamp(.7rem, 2.6vw, 1rem); opacity: .8; margin-top: 10px; letter-spacing: .12em; }
  .note { margin-top: clamp(24px, 4vh, 40px); max-width: 520px; font-size: clamp(.8rem, 2.8vw, .95rem); line-height: 1.6; opacity: .6; }
  .note b { color: #f5c451; font-weight: 600; }
</style>
</head>
<body>
  <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
    <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
    <circle cx="12" cy="15.7" r="1.3" fill="currentColor" stroke="none"/>
  </svg>
  <div class="status">SISTEM DIKUNCI</div>
  <h1>APLIKASI AKAN BISA DIGUNAKAN PADA TANGGAL <span class="date">1 DESEMBER 2026</span></h1>
  <div class="timer" id="timer">
    <div class="box"><div class="num" id="d">00</div><div class="lbl">HARI</div></div>
    <div class="box"><div class="num" id="h">00</div><div class="lbl">JAM</div></div>
    <div class="box"><div class="num" id="m">00</div><div class="lbl">MENIT</div></div>
    <div class="box"><div class="num" id="s">00</div><div class="lbl">DETIK</div></div>
  </div>
  <p class="note" id="note">Akses ke seluruh fitur ditutup sampai waktu di atas. Mengubah jam atau tanggal perangkat tidak akan membukanya.</p>

<script>
(function () {
  "use strict";

  // 1 Desember 2026, 00:00 WITA (GMT+8)
  var TARGET = new Date("2026-12-01T00:00:00+08:00").getTime();
  var LS_KEY = "sm_lock_lastseen";

  var baseTime = Date.now();        // waktu "terpercaya" saat sinkron terakhir
  var basePerf = performance.now(); // penghitung monotonik saat sinkron terakhir
  var synced = false;               // true kalau waktu berasal dari server

  // Pegangan terakhir: waktu terbesar yang pernah terlihat di perangkat ini.
  // Kalau jam HP diundur, waktu tidak ikut mundur.
  function lastSeen() {
    try { return parseInt(localStorage.getItem(LS_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function saveSeen(t) {
    try { if (t > lastSeen()) localStorage.setItem(LS_KEY, String(t)); } catch (e) {}
  }
  baseTime = Math.max(baseTime, lastSeen());

  function now() {
    // Dihitung dari penghitung monotonik, jadi mengubah jam perangkat saat halaman terbuka tidak berpengaruh.
    return baseTime + (performance.now() - basePerf);
  }

  // Ambil waktu server dari header Date milik hosting sendiri.
  function syncServer() {
    var url = location.href.split("#")[0].split("?")[0] + "?_=" + Date.now();
    var t0 = performance.now();
    return fetch(url, { method: "HEAD", cache: "no-store" })
      .then(function (res) {
        var h = res.headers.get("Date");
        var t = h ? new Date(h).getTime() : NaN;
        if (!isNaN(t)) {
          var rtt = performance.now() - t0;
          baseTime = Math.max(t + rtt / 2, lastSeen());
          basePerf = performance.now();
          synced = true;
        }
      })
      .catch(function () { /* offline atau dibuka dari file: pakai jam perangkat + pengaman di atas */ });
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  var opening = false;
  function tick() {
    var t = now();
    saveSeen(t);
    var diff = Math.max(0, TARGET - t);
    var sec = Math.floor(diff / 1000);
    document.getElementById("d").textContent = pad(Math.floor(sec / 86400));
    document.getElementById("h").textContent = pad(Math.floor(sec % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(sec % 3600 / 60));
    document.getElementById("s").textContent = pad(sec % 60);
    if (diff === 0 && !opening) openApp();
  }

  // Saat waktunya tiba, minta ulang halaman ini dari server.
  // Kalau file sudah diganti dengan aplikasi asli, yang terbuka adalah aplikasi.
  function openApp() {
    opening = true;
    var note = document.getElementById("note");
    note.textContent = "Waktunya tiba. Membuka aplikasi...";
    syncServer().then(function () {
      if (now() < TARGET) { opening = false; return; } // server belum sampai waktunya
      var key = "sm_lock_tries", tries = 0;
      try { tries = parseInt(sessionStorage.getItem(key), 10) || 0; sessionStorage.setItem(key, String(tries + 1)); } catch (e) {}
      if (tries >= 3) {
        note.innerHTML = "Waktu pembukaan sudah lewat. Jika halaman ini masih tampil, <b>hubungi admin sistem</b>.";
        return;
      }
      setTimeout(function () { location.replace(location.pathname + "?open=" + Date.now()); }, 1500);
    });
  }

  tick();
  setInterval(tick, 1000);
  syncServer().then(tick);
  setInterval(syncServer, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) syncServer().then(tick); });
})();
</script>
</body>
</html>
