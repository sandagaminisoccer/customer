<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>ADMIN SANDAGA MINISOCCER</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #fff; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  h1 {
    margin: 0 0 clamp(32px, 6vh, 60px); max-width: 900px;
    font-size: clamp(1rem, 4.2vw, 1.8rem); font-weight: 600;
    letter-spacing: .12em; line-height: 1.6;
    text-wrap: balance;
  }
  h1 .date {
    display: block; margin-top: .6em; white-space: nowrap;
    font-size: clamp(1.5rem, 7.5vw, 4rem); font-weight: 800;
    letter-spacing: .06em; line-height: 1.15;
    color: #f5c451;
  }
  .timer {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2.5vw, 24px); width: 100%; max-width: 620px;
  }
  .box {
    border: 1px solid rgba(255,255,255,.3); border-radius: 14px;
    padding: clamp(14px, 3.5vw, 28px) 4px;
  }
  .num {
    font-size: clamp(2rem, 10vw, 4.5rem); font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .lbl {
    font-size: clamp(.7rem, 2.6vw, 1rem); opacity: .8;
    margin-top: 10px; letter-spacing: .12em;
  }
</style>
</head>
<body>
  <h1>APLIKASI AKAN BISA DIGUNAKAN PADA TANGGAL <span class="date">1 DESEMBER 2026</span></h1>
  <div class="timer" id="timer">
    <div class="box"><div class="num" id="d">00</div><div class="lbl">HARI</div></div>
    <div class="box"><div class="num" id="h">00</div><div class="lbl">JAM</div></div>
    <div class="box"><div class="num" id="m">00</div><div class="lbl">MENIT</div></div>
    <div class="box"><div class="num" id="s">00</div><div class="lbl">DETIK</div></div>
  </div>
<script>
  // 1 Desember 2026, 00:00 WIB
  var target = new Date("2026-12-01T00:00:00+07:00").getTime();
  function pad(n){ return String(n).padStart(2, "0"); }
  function tick(){
    var diff = Math.max(0, target - Date.now());
    var sec = Math.floor(diff / 1000);
    document.getElementById("d").textContent = pad(Math.floor(sec / 86400));
    document.getElementById("h").textContent = pad(Math.floor(sec % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(sec % 3600 / 60));
    document.getElementById("s").textContent = pad(sec % 60);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
